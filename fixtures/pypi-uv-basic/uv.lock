version = 1
requires-python = ">=3.8"

[[package]]
name = "webwidget"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "click" },
    { name = "jinja2" },
]

[package.dev-dependencies]
dev = [
    { name = "sphinx" },
]

[[package]]
name = "click"
version = "8.1.7"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "jinja2"
version = "3.1.4"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "markupsafe" },
]

[[package]]
name = "markupsafe"
version = "2.1.5"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "sphinx"
version = "7.4.7"
source = { registry = "https://pypi.org/simple" }
resolution-markers = [
    "python_full_version < '3.11'",
]
dependencies = [
    { name = "jinja2" },
]

[[package]]
name = "sphinx"
version = "8.0.2"
source = { registry = "https://pypi.org/simple" }
resolution-markers = [
    "python_full_version >= '3.11'",
]
dependencies = [
    { name = "jinja2" },
]
